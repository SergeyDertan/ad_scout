<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The tab icon for both builds: the same lockup mark the console header
       wears (an indigo square holding the target glyph from components/icons).
       Kept in step with `brand.solid` (#4f46e5) in web/src/theme.ts.

       Drawn heavier than the in-app icon on purpose — the header renders it at
       20px, a favicon at 16px, where 2px feather strokes silt up into a blob.

       favicon.ico beside this file is cut FROM this file, for Safari, which
       ignores SVG favicons and shows nothing rather than falling back. Redo it
       after any edit here:

         for s in 16 32 48; do rsvg-convert -w $s -h $s public/favicon.svg -o /tmp/f-$s.png; done
         magick /tmp/f-16.png /tmp/f-32.png /tmp/f-48.png public/favicon.ico
  -->
  <rect width="32" height="32" rx="7" fill="#4f46e5"/>
  <g fill="none" stroke="#fff" stroke-width="2.6">
    <circle cx="16" cy="16" r="9"/>
    <circle cx="16" cy="16" r="3.6"/>
  </g>
</svg>
