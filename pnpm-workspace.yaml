# pnpm workspace. The root project is the AdScout server (package "adscout");
# the front-end lives in web/ (package "adscout-web"). `pnpm install` at the
# root installs both. Run web scripts with `pnpm --filter adscout-web <script>`.
packages:
  - 'web'

allowBuilds:
  # Neither firebase package needs its postinstall (they only print banners /
  # regenerate optional protobuf artifacts we don't use), so both stay blocked.
  '@firebase/util': false
  esbuild: true
  leveldown: true
  protobufjs: false

minimumReleaseAgeExclude:
  - '@types/node@26.1.1'
  - imapflow@1.4.7 || 1.6.4
  - vite@8.1.5
  - tsx@4.23.7

# Native/binary deps whose install scripts we allow to run (pnpm v10 blocks
# build scripts by default).
onlyBuiltDependencies:
  - esbuild
  - fsevents
  - leveldown
